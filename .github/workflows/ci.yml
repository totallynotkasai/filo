name: CI

# `verify` runs the full `npm run ci:verify` chain (lint, svelte-check, main
# type-check, strict unit tests, build, every gate) on Linux. `verify-windows`
# runs the parts that behave differently on Windows: the unit tests (the
# `itOnWindows` cases and case-insensitive path handling) and the main-process
# type-check. The a11y axe scan and full Electron E2E are manual-only
# (Actions tab -> CI -> Run workflow).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, types, tests, build, ratchets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # The whole chain in one place, so CI and a local `npm run ci:verify`
      # can't drift apart.
      - run: npm run ci:verify

  verify-windows:
    # Not the full chain: the gates and the build are platform-agnostic, so
    # repeating them here would only double the runtime.
    name: Verify on Windows (unit tests, main type-check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit:strict
      - run: npm run typecheck:main

  coverage:
    # PR-only because v8 coverage instrumentation roughly doubles the
    # vitest runtime — `verify` stays fast for branch pushes. Thresholds
    # live in vitest.config.mts under `test.coverage.thresholds`; raise
    # them whenever new tests push the floor up (ratchet, never lower).
    name: Coverage (PR only)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit:coverage
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  a11y:
    name: a11y (axe-core E2E subset, manual)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: xvfb-run --auto-servernum -- npx playwright test a11y.test.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e:
    name: Full E2E (manual)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: xvfb-run --auto-servernum -- npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
