name: CI

# GitHub runs only the Linux jobs. Every push and PR runs `verify`: the full
# `npm run ci:verify` chain (lint, svelte-check, main type-check, strict unit
# tests, build, every gate). `coverage` (the coverage ratchet) repeats the
# whole suite instrumented, so it runs weekly and on demand (Actions tab -> CI
# -> Run workflow). A push that touches only `docs/` runs nothing: no gate
# reads it.
#
# The Windows checks run on the developer's Windows machine before pushing,
# not here (Windows minutes bill double): `npm run test:unit:strict` covers
# the `itOnWindows` cases, case-insensitive path handling and the
# characterisation cases skipped on Linux; `npm run build && npm run test:e2e`
# drives the built app. See "CI gates" in CLAUDE.md.

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  # The event is in the key so a push to main never cancels the weekly run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, types, tests, build, ratchets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # The whole chain in one place, so CI and a local `npm run ci:verify`
      # can't drift apart.
      - run: npm run ci:verify

  coverage:
    # Its own job because v8 coverage instrumentation roughly doubles the
    # vitest runtime, so `verify` stays fast.
    # Thresholds live in vitest.config.mts under `test.coverage.thresholds`;
    # raise them whenever new tests push the floor up (ratchet, never lower).
    # `test:unit:coverage` passes --disableConsoleIntercept: under the
    # instrumented suite's load, a worker could close while a captured console
    # line was still in flight, an unhandled error that fails the run with
    # every test green. The strict runner, which reads that output, is `verify`.
    name: Coverage (weekly and manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit:coverage
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
